<html>
  <link rel="stylesheet" type="text/css" href="../global.css" />
  <style>
    #user_avatar {
      width: 120px;
      height: 120px;
      position: absolute;
      top: 20px;
      left: 22px;
    }
    #game_frame {
      width: 600px;
	    height: 900px;
      position: relative;
      background: linear-gradient(rgb(98, 186, 244), rgb(111, 173, 220));
    }
    #upper {
      width: 600px;
      height: 900px;
      background-color: rgb(42, 95, 131);
    }
    #background {
      background-color: rgba(255, 255, 255, 0.6);
      width: 600px;
      height: 120px;
      border-radius: 0px 0px 45px 45px;
    }
   
    #xp_bar {
      width: 150px;
      height: 35px;
      background-color: rgb(55, 0, 255);
      position: absolute;
      border-radius: 0px 20px 20px 0px;
      top: 40px;
      left: 135px;
    }
    #xp_bar_ {
      width: 50%;
      height: 35px;
      background-color: rgb(255, 29, 29);
      border-radius: 0px 20px 20px 0px;
    }
    #xp_text {
      font-size: 22px;
      width: 200px;
      color: white;
      mix-blend-mode: difference;
      font-family: 'Jost', sans-serif;
      position: absolute;
      top: 1px;
      left: 15px;
    }
  </style>
  <div id="game_frame">
    <div id="background">
      <div id="xp_bar">
        <div id="xp_bar_"></div>
        <label id="xp_text">XP: 0/0</label>
      </div>
      <img src="../sources/vejo.png" id="user_avatar"></img>
    </div>
  </div>
</html>
