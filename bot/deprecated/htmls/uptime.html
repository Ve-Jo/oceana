<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>System Uptime</title>
		<style>
			body {
				font-family: "Arial", sans-serif;
				background-color: #f3f3f3;
				color: #333;
				text-align: center;
				padding: 20px;
			}
			.container {
				background-color: #fff;
				border-radius: 8px;
				padding: 20px;
				margin: 0 auto;
				width: 80%;
				max-width: 700px;
			}
			.header {
				font-size: 24px;
				margin-bottom: 30px;
			}
			.uptime-info {
				font-size: 22px; /* Увеличиваем размер шрифта */
				font-weight: bold; /* Делаем текст жирным */
				/* другие стили */
			}
			.value {
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">System Uptime Information</div>
			<div class="uptime-info">
				<div id="uptime"></div>
				<div id="total_memory"></div>
				<div id="free_memory"></div>
				<div id="load_average"></div>
				<div id="cpu_model"></div>
				<!-- Добавь другие необходимые поля -->
			</div>
		</div>
	</body>
</html>
